exclude: ^(.idea/.*|.run/.*|node_modules/.*|pnpm-lock.yaml|lib/.*|dist/.*)$
#fail_fast: true
repos:
  - repo: local
    hooks:
      - id: prettier
        entry: prettier
        language: system
        name: prettier https://prettier.io/docs/en/precommit.html .
        args: [ --ignore-unknown, --write ]
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: markdownlint # Configure in .mdlrc
        name: Check markdown files https://github.com/jumanjihouse/pre-commit-hooks#markdownlint .
        args: [-r, '~MD013,~MD004,~MD026,~MD033']
  #      - id: shellcheck
  - repo: https://github.com/Lucas-C/pre-commit-hooks-nodejs
    rev: v1.1.2
    hooks:
      #      - id: dockerfile_lint
      - id: markdown-toc
        args: ['--bullets', '+', '-i']
